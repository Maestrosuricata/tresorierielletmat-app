<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tresorierielletmat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 8px; padding: 30px; }
        h1 { font-size: 28px; margin-bottom: 8px; color: #333; }
        h2 { font-size: 18px; margin-bottom: 20px; color: #666; }
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 30px; }
        .tab-btn { padding: 12px 24px; background: none; border: none; cursor: pointer; font-size: 15px; color: #666; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #0066cc; border-bottom-color: #0066cc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-section { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0052a3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tresorierielletmat</h1>
        <h2>Saisie des données financières</h2>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab(event, 'rec')">Recettes</button>
            <button class="tab-btn" onclick="showTab(event, 'dep')">Dépenses</button>
            <button class="tab-btn" onclick="showTab(event, 'adh')">Adhésions</button>
        </div>

        <div id="rec" class="tab-content active">
            <div class="form-section">
                <h3>Ajouter une recette</h3>
                <div class="form-grid">
                    <div class="form-group"><label>Date</label><input type="date" id="rec-date"></div>
                    <div class="form-group"><label>Payeur</label><input type="text" id="rec-payeur" placeholder="Jean"></div>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Source</label><select id="rec-source"><option>Adhésions</option><option>Tournois</option></select></div>
                    <div class="form-group"><label>Destination</label><select id="rec-destination"><option>Buvette</option><option>Tournois</option></select></div>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Montant (€)</label><input type="number" id="rec-montant" step="0.01"></div>
                    <div class="form-group"><label>Mode</label><select id="rec-mode"><option>Chèque</option><option>Espèces</option></select></div>
                </div>
                <button onclick="saveRec()">✓ Ajouter recette</button>
            </div>
        </div>

        <div id="dep" class="tab-content">
            <div class="form-section">
                <h3>Ajouter une dépense</h3>
                <div class="form-grid">
                    <div class="form-group"><label>Date</label><input type="date" id="dep-date"></div>
                    <div class="form-group"><label>Créancier</label><input type="text" id="dep-creancier"></div>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Catégorie</label><select id="dep-categorie"><option>Buvette</option><option>Tournois</option></select></div>
                    <div class="form-group"><label>Payeur</label><select id="dep-payeur"><option>Mariano</option><option>Hervé</option></select></div>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Montant (€)</label><input type="number" id="dep-montant" step="0.01"></div>
                    <div class="form-group"><label>Mode</label><select id="dep-mode"><option>Chèque</option><option>Espèces</option></select></div>
                </div>
                <button onclick="saveDep()">✓ Ajouter dépense</button>
            </div>
        </div>

        <div id="adh" class="tab-content">
            <div class="form-section">
                <h3>Ajouter une adhésion</h3>
                <div class="form-grid">
                    <div class="form-group"><label>Section</label><select id="adh-section"><option>Betton</option><option>Saint-Grégoire</option></select></div>
                    <div class="form-group"><label>Catégorie</label><select id="adh-categorie"><option>Adhésion</option><option>Famille</option></select></div>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Montant (€)</label><input type="number" id="adh-montant" step="0.01"></div>
                    <div class="form-group"><label>Date</label><input type="date" id="adh-date"></div>
                </div>
                <button onclick="saveAdh()">✓ Ajouter adhésion</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { addRecette, addDepense, addAdhesion } from './supabase-connector.js';

        window.showTab = function(e, tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            e.target.classList.add('active');
        }

        window.saveRec = async function() {
            const data = { date: document.getElementById('rec-date').value, payeur: document.getElementById('rec-payeur').value, source: document.getElementById('rec-source').value, destination: document.getElementById('rec-destination').value, montant: document.getElementById('rec-montant').value, mode: document.getElementById('rec-mode').value, statut: 'À encaisser', ch_banque: null, ch_num: null };
            if (!data.date || !data.payeur || !data.montant) { alert('Remplis tous les champs'); return; }
            try { await addRecette(data); alert('✓ Recette ajoutée'); } catch (e) { alert('Erreur: ' + e.message); }
        }

        window.saveDep = async function() {
            const data = { date: document.getElementById('dep-date').value, creancier: document.getElementById('dep-creancier').value, categorie: document.getElementById('dep-categorie').value, payeur: document.getElementById('dep-payeur').value, montant: document.getElementById('dep-montant').value, mode: document.getElementById('dep-mode').value, statut: 'Payé', piece: null };
            if (!data.date || !data.creancier || !data.montant) { alert('Remplis tous les champs'); return; }
            try { await addDepense(data); alert('✓ Dépense ajoutée'); } catch (e) { alert('Erreur: ' + e.message); }
        }

        window.saveAdh = async function() {
            const data = { section: document.getElementById('adh-section').value, categorie: document.getElementById('adh-categorie').value, montant: document.getElementById('adh-montant').value, date: document.getElementById('adh-date').value, statut: 'À encaisser', licence: 'A', maman_de_joueur: false, ch_banque: null, ch_num: null };
            if (!data.section || !data.montant || !data.date) { alert('Remplis tous les champs'); return; }
            try { await addAdhesion(data); alert('✓ Adhésion ajoutée'); } catch (e) { alert('Erreur: ' + e.message); }
        }
    </script>
</body>
</html>
