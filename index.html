<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tresorierielletmat — Saisie des données</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #333;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #666;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 30px;
        }

        .tab-button {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.2s;
        }

        .tab-button.active {
            color: #0066cc;
            border-bottom-color: #0066cc;
        }

        .tab-button:hover {
            color: #0066cc;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-grid.single {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 2px rgba(0,102,204,0.1);
        }

        button.submit-btn {
            width: 100%;
            padding: 12px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            background: #0052a3;
        }

        .data-list {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
        }

        .data-list h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
            font-weight: 600;
        }

        .data-list p {
            color: #666;
            font-size: 14px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tresorierielletmat</h1>
        <h2>Saisie des données financières</h2>

        <div class="tabs">
            <button class="tab-button active" id="tab-recettes">Recettes</button>
            <button class="tab-button" id="tab-depenses">Dépenses</button>
            <button class="tab-button" id="tab-adhesions">Adhésions</button>
        </div>

        <!-- ONGLET RECETTES -->
        <div id="content-recettes" class="tab-content active">
            <div class="form-section">
                <h3>Ajouter une recette</h3>
                <div id="success-recettes" class="success-message"></div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="rec-date">
                    </div>
                    <div class="form-group">
                        <label>Payeur</label>
                        <input type="text" id="rec-payeur" placeholder="Jean Dupont">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Source (catégorie)</label>
                        <select id="rec-source">
                            <option>Adhésions</option>
                            <option>Tournois</option>
                            <option>Apéro</option>
                            <option>Pot</option>
                            <option>Matériel</option>
                            <option>Cahier</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Destination</label>
                        <select id="rec-destination">
                            <option>Buvette</option>
                            <option>Tournois</option>
                            <option>Animation</option>
                            <option>Autre</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Montant (€)</label>
                        <input type="number" id="rec-montant" placeholder="120" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Mode de paiement</label>
                        <select id="rec-mode">
                            <option>Chèque</option>
                            <option>Espèces</option>
                            <option>Virement</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="rec-statut">
                            <option>À encaisser</option>
                            <option>Encaissé</option>
                            <option>Annulé</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Banque (si chèque)</label>
                        <input type="text" id="rec-banque" placeholder="Crédit Agricole">
                    </div>
                </div>

                <div class="form-grid single">
                    <div class="form-group">
                        <label>Numéro de chèque</label>
                        <input type="text" id="rec-num-cheque" placeholder="123456789012">
                    </div>
                </div>

                <button class="submit-btn" id="btn-rec-save">Ajouter une recette</button>
            </div>

            <div class="data-list">
                <h3>Recettes enregistrées</h3>
                <p>Aucune recette pour l'instant.</p>
            </div>
        </div>

        <!-- ONGLET DÉPENSES -->
        <div id="content-depenses" class="tab-content">
            <div class="form-section">
                <h3>Ajouter une dépense</h3>
                <div id="success-depenses" class="success-message"></div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="dep-date">
                    </div>
                    <div class="form-group">
                        <label>Créancier (à qui on paie)</label>
                        <input type="text" id="dep-creancier" placeholder="Fournisseur, nom">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Catégorie</label>
                        <select id="dep-categorie">
                            <option>Buvette</option>
                            <option>Tournois</option>
                            <option>Animation</option>
                            <option>Matériel</option>
                            <option>Frais de fonctionnement</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Payeur (qui a payé)</label>
                        <select id="dep-payeur">
                            <option>Mariano</option>
                            <option>Hervé</option>
                            <option>Autre</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Montant (€)</label>
                        <input type="number" id="dep-montant" placeholder="85.50" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Mode</label>
                        <select id="dep-mode">
                            <option>Chèque</option>
                            <option>Espèces</option>
                            <option>Virement</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="dep-statut">
                            <option>Payé</option>
                            <option>Impayé</option>
                            <option>Annulé</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pièce (facture, devis)</label>
                        <input type="text" id="dep-piece" placeholder="Numéro">
                    </div>
                </div>

                <button class="submit-btn" id="btn-dep-save">Ajouter une dépense</button>
            </div>

            <div class="data-list">
                <h3>Dépenses enregistrées</h3>
                <p>Aucune dépense pour l'instant.</p>
            </div>
        </div>

        <!-- ONGLET ADHÉSIONS -->
        <div id="content-adhesions" class="tab-content">
            <div class="form-section">
                <h3>Ajouter une adhésion</h3>
                <div id="success-adhesions" class="success-message"></div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Section</label>
                        <select id="adh-section">
                            <option>Betton</option>
                            <option>Saint-Grégoire</option>
                            <option>Montgermont</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Catégorie</label>
                        <select id="adh-categorie">
                            <option>Adhésion individuelle</option>
                            <option>Famille</option>
                            <option>Loisir</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Montant (€)</label>
                        <input type="number" id="adh-montant" placeholder="120" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Mode</label>
                        <select id="adh-mode">
                            <option>Chèque</option>
                            <option>Espèces</option>
                            <option>Virement</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="adh-date">
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="adh-statut">
                            <option>À encaisser</option>
                            <option>Encaissé</option>
                            <option>Annulé</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Licence FFE</label>
                        <select id="adh-licence">
                            <option>A</option>
                            <option>B</option>
                            <option>Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Maman de joueur</label>
                        <select id="adh-maman">
                            <option>Non</option>
                            <option>Oui</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Banque (si chèque)</label>
                        <input type="text" id="adh-banque" placeholder="Crédit Agricole">
                    </div>
                    <div class="form-group">
                        <label>N° chèque</label>
                        <input type="text" id="adh-num-cheque" placeholder="123456789012">
                    </div>
                </div>

                <button class="submit-btn" id="btn-adh-save">Ajouter une adhésion</button>
            </div>

            <div class="data-list">
                <h3>Adhésions enregistrées</h3>
                <p>Aucune adhésion pour l'instant.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { addRecette, addDepense, addAdhesion } from './supabase-connector.js';

        // Gestion des onglets
        document.getElementById('tab-recettes').addEventListener('click', () => switchTab('recettes'));
        document.getElementById('tab-depenses').addEventListener('click', () => switchTab('depenses'));
        document.getElementById('tab-adhesions').addEventListener('click', () => switchTab('adhesions'));

        function switchTab(tabName) {
            // Masquer tous les onglets
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            
            // Afficher l'onglet sélectionné
            document.getElementById(`content-${tabName}`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // Recettes
        document.getElementById('btn-rec-save').addEventListener('click', async () => {
            const data = {
                date: document.getElementById('rec-date').value,
                payeur: document.getElementById('rec-payeur').value,
                source: document.getElementById('rec-source').value,
                destination: document.getElementById('rec-destination').value,
                montant: document.getElementById('rec-montant').value,
                mode: document.getElementById('rec-mode').value,
                statut: document.getElementById('rec-statut').value,
                ch_banque: document.getElementById('rec-banque').value,
                ch_num: document.getElementById('rec-num-cheque').value
            };

            if (!data.date || !data.payeur || !data.montant) {
                alert('Remplis les champs obligatoires : Date, Payeur, Montant');
                return;
            }

            const success = await addRecette(data);
            if (success) {
                showMessage('success-recettes', 'Recette ajoutée ✓');
                document.querySelectorAll('#content-recettes input, #content-recettes select').forEach(el => el.value = '');
            }
        });

        // Dépenses
        document.getElementById('btn-dep-save').addEventListener('click', async () => {
            const data = {
                date: document.getElementById('dep-date').value,
                creancier: document.getElementById('dep-creancier').value,
                categorie: document.getElementById('dep-categorie').value,
                payeur: document.getElementById('dep-payeur').value,
                montant: document.getElementById('dep-montant').value,
                mode: document.getElementById('dep-mode').value,
                statut: document.getElementById('dep-statut').value,
                piece: document.getElementById('dep-piece').value
            };

            if (!data.date || !data.creancier || !data.montant) {
                alert('Remplis les champs obligatoires : Date, Créancier, Montant');
                return;
            }

            const success = await addDepense(data);
            if (success) {
                showMessage('success-depenses', 'Dépense ajoutée ✓');
                document.querySelectorAll('#content-depenses input, #content-depenses select').forEach(el => el.value = '');
            }
        });

        // Adhésions
        document.getElementById('btn-adh-save').addEventListener('click', async () => {
            const data = {
                section: document.getElementById('adh-section').value,
                categorie: document.getElementById('adh-categorie').value,
                montant: document.getElementById('adh-montant').value,
                mode: document.getElementById('adh-mode').value,
                date: document.getElementById('adh-date').value,
                statut: document.getElementById('adh-statut').value,
                licence: document.getElementById('adh-licence').value,
                maman_de_joueur: document.getElementById('adh-maman').value,
                ch_banque: document.getElementById('adh-banque').value,
                ch_num: document.getElementById('adh-num-cheque').value
            };

            if (!data.section || !data.montant || !data.date) {
                alert('Remplis les champs obligatoires : Section, Montant, Date');
                return;
            }

            const success = await addAdhesion(data);
            if (success) {
                showMessage('success-adhesions', 'Adhésion ajoutée ✓');
                document.querySelectorAll('#content-adhesions input, #content-adhesions select').forEach(el => el.value = '');
            }
        });

        function showMessage(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
